<!DOCTYPE html>
<style>
        body {
            background-color:#FFEF00;
        }

        button {
            margin-top:10px;
            background-color:black;
            border-radius:30px;
            width:250px;
            height:50px;
            color:white;
        }

        input {
            margin-top:10px;
            background-color:gray;
            border-radius:30px;
            width:250px;
            height:50px;
            color:white;
        }

        input::placeholder {
            color:white;
        }
</style>
<html>
    <head>
        <title>Name Randomizer</title>
    </head>
    <body>
        <section>
            <center>
                <h1>Name Randomizer</h1>
                <h3>---------------------------------------------------</h3>
            </center>
        </section>
        <section>
            <center>
                <input type="text" placeholder="Enter Names: " id="name1">
                <button onclick="AddPeople()">Add Player</button>
                <button onclick="SelectPlayer()">Select Person</button>
            </center>
        </section>
    </body>
</html>
<script>
    const players = []
    function AddPeople() {
        players.push(document.getElementById("name1").value);
        alert("Successfully added the person as a candidate!");
        document.getElementById("name1").value = "";
    }

    function SelectPlayer() {
        const player = Math.floor(Math.random() * players.length)
        localStorage.setItem("player", players[player])
        window.location.href="namerandomizerresult.html"
    }


</script>
